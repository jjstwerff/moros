// Copyright (c) 2026 Jurjen Stellingwerff
// SPDX-License-Identifier: LGPL-3.0-or-later
//
// Asyncify controller — the async→sync bridge shared by every --html target
// (GL games, and the headless compute page's store_load_url_trusted fetch).
// A suspend import (loft_gl_swap_buffers / loft_web.ws_yield / loft_io.loft_host_http_get)
// calls ac.suspend() to unwind the whole wasm stack back to the JS event loop;
// the driver later calls ac.resume(fn) to rewind and continue past the yield.
// Usage: const ac = new AsyncifyCtrl(instance);
//        ac.start('loft_start');            // runs until the first suspend
//        if (ac.sleeping) /* pump */ ac.resume('loft_start');
//
// Extracted from loft-gl-wasm.js so the headless template can drive asyncify too
// (one definition, no drift).

function AsyncifyCtrl(instance) {
  // Asyncify data area: an 8-byte struct {current, end} in WASM memory plus a
  // STACK_SIZE save region, allocated right after __heap_base.  `current`
  // (struct field @0) is the live cursor; `end` (@4) caps the save region.
  const DATA_ADDR = (instance.exports.__heap_base?.value || 65536);
  const STACK_SIZE = 16384;  // 16KB for asyncify stack
  const E = instance.exports;
  this.sleeping = false;
  this.exports = E;
  // The save-buffer top after the last unwind.  Asyncify writes the stack
  // UPWARD from the buffer base during an unwind (leaving `current` at the
  // top), and reads it back DOWNWARD during a rewind — so the rewind must
  // start from this saved top, not the base.  Resetting `current` to the base
  // before a rewind loses every saved frame, so the program rewinds into an
  // empty stack and "returns" without ever resuming past the yield (issue
  // #450: the page printed only the first line, then stuck).
  let savedTop = DATA_ADDR + 8;
  const STATE_REWINDING = 2;

  const setStruct = (cur, end) => {
    const mem = new Int32Array(E.memory.buffer);
    mem[DATA_ADDR >> 2] = cur;
    mem[(DATA_ADDR + 4) >> 2] = end;
  };
  const curPtr = () => new Int32Array(E.memory.buffer)[DATA_ADDR >> 2];

  this.start = function(fn) {
    this.sleeping = false;
    E[fn]();
    // suspend() set sleeping + started the unwind; close it out and remember
    // the saved top for the matching rewind.
    if (this.sleeping) {
      savedTop = curPtr();
      E.asyncify_stop_unwind();
    }
  };

  this.resume = function(fn) {
    if (!this.sleeping) return false;
    this.sleeping = false;
    // current = saved top (rewind reads downward); end = buffer top.
    setStruct(savedTop, DATA_ADDR + 8 + STACK_SIZE);
    E.asyncify_start_rewind(DATA_ADDR);
    E[fn]();
    if (this.sleeping) {
      savedTop = curPtr();
      E.asyncify_stop_unwind();
    }
    return true;
  };

  // Called from a suspend import (loft_gl_swap_buffers, loft_web.ws_yield,
  // loft_io.loft_host_http_get) to yield a frame.  The import is re-invoked while
  // asyncify REWINDS — that call is the replay reaching the original yield point,
  // so it must stop_rewind and RETURN, letting execution continue PAST the yield.
  // Re-starting an unwind there (the old bug) spins forever on one iteration:
  // every resume rewound to the yield and immediately re-suspended without
  // making progress.  In the NORMAL state, start an unwind so control returns
  // to the JS event loop.
  this.suspend = function() {
    if (E.asyncify_get_state() === STATE_REWINDING) {
      E.asyncify_stop_rewind();
      return;
    }
    this.sleeping = true;
    setStruct(DATA_ADDR + 8, DATA_ADDR + 8 + STACK_SIZE);
    E.asyncify_start_unwind(DATA_ADDR);
  };
}

//
// @PLN105 Phase 2c — the generic descriptor-driven reader: reconstruct a delivered loft value
// from wasm linear memory using ONLY its layout descriptor + the store base address, with no
// serialization. This MIRRORS `Stores::read_via_descriptor` (src/database/descriptor.rs) — keep
// the two in lockstep; the node harness (tests/deliver_wasm.rs) is the byte-parity gate.
//
// Addressing (Store::checked_offset):  addr(rec, pos) = storeBase + rec*8 + pos
//   * a RECORD field recurses at (rec, pos + field.pos) in the SAME record;
//   * a VECTOR field holds a child record-INDEX vRec (len at vRec*8+4, elem i at vRec*8+8+size*i);
//   * an ARRAY (by-ref vector) holds per-element record-indices (each element data at elmRec*8+8);
//   * TEXT is an interned record: the field holds a string id, len at id*8+4, UTF-8 at id*8+8;
//   * store-internal kinds (Ref / ChildRec / Iterated) are out of this subset — cursor-walked in
//     Phase 3 — exactly as `read_via_descriptor` refuses them.
//
// `desc` is the parsed `LayoutDesc::to_json` blob: {nodes:{<id>:node}, names, sizes}.
// `mem` is the WebAssembly.Memory; its `.buffer` MUST be re-read on each deliver (memory.grow
// detaches the old ArrayBuffer — §5 borrow contract). Read (or copy out) within the deliver call.

// NOTE: a plain function (no inline `export`) so it can be `include_str!`-embedded into the
// non-module `--html` shim; the trailing `export { readLoftValue }` (stripped at embed time) keeps
// the node harness's `import { readLoftValue }` working.
function readLoftValue(mem, storeBase, desc, typeId, rec, pos) {
  const view = new DataView(mem.buffer);
  const nodes = desc.nodes;
  const sizeOf = (id) => (desc.sizes && desc.sizes[id] != null ? +desc.sizes[id] : 0);
  const dec = new TextDecoder();

  function read(typeId, rec, pos) {
    const node = nodes[typeId];
    if (!node) throw new Error(`deliver: type ${typeId} not in descriptor`);
    const at = storeBase + rec * 8 + pos;
    switch (node.kind) {
      case "base":
        return readBase(node.base, at);
      case "byte": {
        // Narrow 1-byte int (Parts::Byte): stored as `(value - start)` so the packed byte spans
        // 0..255; a nullable byte reserves 255 for null. Re-add `start` to recover the signed value
        // (u8 start=0 → 0..255; i8 start=-128 → -128..127). NOTE: the Rust twin read_via_descriptor
        // emits the PACKED byte (a byte-parity artefact) — this reader reconstructs the true VALUE.
        const raw = view.getUint8(at);
        if (node.nullable && raw === 255) return null;
        return raw + node.start;
      }
      case "shortraw": {
        // Non-null narrow 2-byte int (Parts::ShortRaw): `(value - start)` as a u16, full range, no
        // reserved sentinel. Read UNSIGNED then re-add start (u16 start=0; i16 start=-32768).
        return view.getUint16(at, true) + node.start;
      }
      case "short": {
        // Nullable narrow 2-byte int (Parts::Short): `(value - start + 1)` as a u16 with 0 reserved
        // for null (so a nullable field holds 65535 distinct values). Undo the +1 shift.
        const raw = view.getUint16(at, true);
        if (node.nullable && raw === 0) return null;
        return raw + node.start - 1;
      }
      case "int":
        // 4-byte int (Parts::Int): stored directly as i32 — `start` is the null-sentinel boundary
        // (i32::MIN+1), NOT a packing offset, so no adjustment. (u32 > 2^31 is a known edge: it
        // reads back negative here, matching the Rust twin's get_i32_raw.)
        return view.getInt32(at, true);
      case "record":
      case "enumvalue": {
        const o = {};
        for (const f of node.fields) {
          // Skip the non-data fields read_data skips: the enum discriminant, absent fields, and any
          // `#`-prefixed SYNTHETIC field (e.g. an index node's #left/#right/#color tree bookkeeping).
          if (f.name === "enum" || f.pos === 65535 || f.name[0] === "#") continue;
          o[f.name] = read(f.content, rec, pos + f.pos);
        }
        return o;
      }
      case "enum": {
        // Plain (value) enum — Parts::Enum/Choices, stored 1-BASED (first variant = 1; 0 unused,
        // 255 = null sentinel), so the variant is `variants[disc - 1]`. The Rust twin emits the raw
        // 1-based byte; this reader resolves it to the variant NAME.
        const disc = view.getUint8(at);
        if (disc === 0 || disc === 255) return null;
        const v = node.variants[disc - 1];
        return v ? v.name : disc;
      }
      case "vector": {
        const vRec = view.getUint32(at, true);
        if (vRec === 0) return [];
        const len = view.getUint32(storeBase + vRec * 8 + 4, true);
        const size = sizeOf(node.elem);
        const fast = scalarFastLane(nodes[node.elem], storeBase + vRec * 8 + 8, len);
        if (fast) return fast; // zero-copy typed-array VIEW over wasm memory
        const a = new Array(len);
        for (let i = 0; i < len; i++) a[i] = read(node.elem, vRec, 8 + size * i);
        return a;
      }
      case "array": {
        const vRec = view.getUint32(at, true);
        if (vRec === 0) return [];
        const len = view.getUint32(storeBase + vRec * 8 + 4, true);
        const a = new Array(len);
        for (let i = 0; i < len; i++) {
          const elmRec = view.getUint32(storeBase + vRec * 8 + 8 + 4 * i, true);
          a[i] = read(node.elem, elmRec, 8);
        }
        return a;
      }
      case "flatarray": {
        // @PLN105 Phase 3 — a keyed collection pre-flattened at deliver time. The materialised data
        // record is NOT in the (type-shared) node; it is looked up in the `flat` redirect map by
        // this collection's `(rec, pos)` — so ONE `flatarray` node serves every instance (e.g. each
        // element of a `vector<Bag>`). Otherwise identical to `array`.
        const dRec = (desc.flat && desc.flat[rec + "_" + pos]) || 0;
        if (dRec === 0) return [];
        const len = view.getUint32(storeBase + dRec * 8 + 4, true);
        const a = new Array(len);
        for (let i = 0; i < len; i++) {
          const elmRec = view.getUint32(storeBase + dRec * 8 + 8 + 4 * i, true);
          a[i] = read(node.elem, elmRec, 8);
        }
        return a;
      }
      case "ref":
      case "childrec":
      case "iterated":
        throw new Error(
          `deliver: type ${typeId} is store-internal (${node.kind}) — cursor-walked in Phase 3`,
        );
      default:
        throw new Error(`deliver: unknown node kind ${node.kind}`);
    }
  }

  function readBase(base, at) {
    switch (base) {
      case "integer":
      case "long":
        return view.getBigInt64(at, true); // loft integer/long are i64
      case "single":
        return view.getFloat32(at, true);
      case "float":
        return view.getFloat64(at, true);
      case "boolean":
        return view.getUint8(at) !== 0;
      case "character":
        return view.getUint32(at, true);
      case "text": {
        const strRec = view.getUint32(at, true);
        if (strRec === 0 || strRec > 0x7fffffff) return null; // STRING_NULL
        const len = view.getUint32(storeBase + strRec * 8 + 4, true);
        return dec.decode(new Uint8Array(mem.buffer, storeBase + strRec * 8 + 8, len));
      }
      default:
        throw new Error(`deliver: unknown base ${base}`);
    }
  }

  // The scalar-vector fast lane — the zero-copy win: a scalar element type maps the whole vector
  // to a typed-array VIEW straight over wasm memory (no per-element decode, no intermediate array).
  // Valid only during the borrow; copy out (Array.from / .slice()) to retain past the deliver call.
  function scalarFastLane(elem, byteBase, len) {
    if (!elem) return null;
    if (elem.kind === "int") return new Int32Array(mem.buffer, byteBase, len);
    if (elem.kind === "base") {
      switch (elem.base) {
        case "single":
          return new Float32Array(mem.buffer, byteBase, len);
        case "float":
          return new Float64Array(mem.buffer, byteBase, len);
        case "integer":
        case "long":
          return new BigInt64Array(mem.buffer, byteBase, len);
      }
    }
    return null;
  }

  return read(typeId, rec, pos);
}



// Copyright (c) 2026 Jurjen Stellingwerff
// SPDX-License-Identifier: LGPL-3.0-or-later
//
// @PLN117 — the host half of loft's browser thread pool: what turns `par` into
// real Web Worker threads.  One source, two embeddings — a module for the
// gallery bundle, and inlined into the single-file `loft --html` page (which
// strips the trailing `export`, the same way loft-asyncify.js is inlined).
//
// Two kinds of loft wasm use this, and the difference is one line in the worker:
//
//   raw (`loft --html`)   — instantiate the module directly, then move this
//                           thread onto its own stack + TLS block.
//   wasm-bindgen gallery  — `import(mainJS)` and let the generated glue do it.
//
// Everything else — who spawns, in what order, and the pool itself — is shared.
//
// Usage:
//   const memory = loftSharedMemory(wasmBytes);     // BEFORE instantiating
//   const { instance } = await WebAssembly.instantiate(module, { env: { memory }, ... });
//   await startLoftWorkers(instance.exports, navigator.hardwareConcurrency, { module, memory });
//   instance.exports.loft_start();
//
// …or, for the gallery, `startLoftWorkers(wasm, n, { memory, mainJS })`.
//
// Without any of this the wasm still runs: rayon falls back to a single-threaded
// pool and `par` runs sequentially, with identical results (@PLN117 arc D).  A
// host that is not cross-origin isolated has no SharedArrayBuffer, so that is
// exactly what it gets.

// Each worker's shadow stack.  wasm-ld gives the main thread 1 MiB; matching it
// keeps a deep loft recursion behaving the same wherever it runs.
const LOFT_WORKER_STACK = 1 << 20;

// The worker body, inlined so a self-contained page stays one file.  The stack
// and TLS setup runs before anything else on this thread: a fresh instance
// starts with the SAME stack pointer as the main thread, so until it is moved
// off it, running any wasm here corrupts the page.
const LOFT_WORKER_SOURCE = `
self.onmessage = async (e) => {
  const { module, memory, handoff, stackTop, tlsBase, mainJS } = e.data;
  let exports;
  try {
    if (mainJS) {
      // wasm-bindgen bundle: its glue owns instantiation, including this
      // thread's stack and TLS.
      const pkg = await import(mainJS);
      exports = await pkg.default({ module_or_path: new URL('loft_bg.wasm', mainJS), memory });
    } else {
      // Raw bundle.  Every import has to be present or the instance will not
      // link, and a worker has none of the page's host objects (no canvas, no
      // DOM).  So each one gets a stub: a worker runs loft bytecode, and a host
      // call from inside a par body no-ops with a warning rather than taking the
      // whole page down.
      const imports = { env: { memory } };
      let warned = false;
      for (const im of WebAssembly.Module.imports(module)) {
        if (im.kind !== 'function') continue;
        (imports[im.module] = imports[im.module] || {})[im.name] = () => {
          if (!warned) {
            warned = true;
            console.warn('loft: host call ' + im.module + '.' + im.name + ' is not available on a worker thread');
          }
        };
      }
      const result = await WebAssembly.instantiate(module, imports);
      exports = (result.instance || result).exports;
      exports.__stack_pointer.value = stackTop;
      if (tlsBase) exports.__wasm_init_tls(tlsBase);
    }
  } catch (err) {
    self.postMessage({ loftWorker: 'failed', error: String((err && err.message) || err) });
    return;
  }
  self.postMessage({ loftWorker: 'ready' });
  try {
    exports.loft_rayon_start_worker(handoff);   // runs until the page ends
  } catch (err) {
    self.postMessage({ loftWorker: 'failed', error: String((err && err.message) || err) });
  }
};`;

/**
 * Build the shared memory a threaded loft wasm imports as `env.memory`.
 *
 * The initial size has to be at least what the module declares, so it is read
 * off the module's own import section rather than guessed.  Returns null when
 * the wasm is not a threaded build (it declares no memory import) or the host
 * cannot share memory, which is the caller's signal to run single-threaded.
 */
function loftSharedMemory(wasmBytes) {
  const limits = loftMemoryImportLimits(wasmBytes);
  if (!limits) return null;
  try {
    return new WebAssembly.Memory({
      initial: limits.initial,
      maximum: limits.maximum || 16384,
      shared: true
    });
  } catch (e) {
    return null;
  }
}

/**
 * The `(initial, maximum)` page counts of the wasm's imported memory, or null if
 * it imports none.  A minimal walk of the import section — enough to size the
 * memory, not a wasm parser.
 */
function loftMemoryImportLimits(wasmBytes) {
  const bytes = wasmBytes instanceof Uint8Array ? wasmBytes : new Uint8Array(wasmBytes);
  let p = 8;                                        // skip magic + version
  const u32 = () => {                               // LEB128
    let result = 0, shift = 0, b;
    do { b = bytes[p++]; result |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
    return result >>> 0;
  };
  while (p < bytes.length) {
    const id = bytes[p++], size = u32(), end = p + size;
    if (id === 2) {                                 // import section
      const count = u32();
      for (let i = 0; i < count; i++) {
        // Read the length first: `p += u32()` would add it to the OLD p, because
        // JS reads the left side before the right side advances it.
        const moduleLen = u32(); p += moduleLen;
        const fieldLen = u32(); p += fieldLen;
        const kind = bytes[p++];
        if (kind === 0) { u32(); }                  // function: type index
        else if (kind === 1) { p++; const f = bytes[p++]; u32(); if (f) u32(); }   // table
        else if (kind === 2) {                      // memory — what we came for
          const flags = bytes[p++];
          const initial = u32();
          const maximum = (flags & 0x01) ? u32() : 0;
          return { initial, maximum };
        } else if (kind === 3) { p++; p++; }        // global
      }
    }
    p = end;
  }
  return null;
}

// Spawned workers are held here so the browser does not collect them out from
// under the pool they are running.
const loftWorkers = [];

/**
 * Start the pool: claim the handoff, spawn `threads` workers, wait for them to
 * come up, then install rayon's global pool over them.  Resolves to the number
 * of worker threads actually running — 0 when the page runs single-threaded,
 * which is a supported outcome and not an error.
 *
 * The three steps have to be in that order and cannot be collapsed: installing
 * the pool waits for the workers to prime, and the workers cannot finish booting
 * until the main thread returns to the event loop.
 *
 * `where` is `{ memory }` plus either `module` (a raw bundle) or `mainJS` (the
 * URL of a wasm-bindgen bundle's glue).
 *
 * Every failure path resolves to 0 rather than throwing: a page whose host
 * cannot thread must still run its program.
 */
async function startLoftWorkers(exports, threads, where) {
  if (!self.crossOriginIsolated || !exports.loft_pool_new || !(threads > 1)) return 0;
  try {
    const handoff = exports.loft_pool_new(threads);
    if (!handoff) return 0;
    const { module = null, memory, mainJS = null } = where;
    const url = URL.createObjectURL(new Blob([LOFT_WORKER_SOURCE], { type: 'text/javascript' }));
    const tlsSize = !mainJS && exports.__tls_size ? exports.__tls_size.value : 0;
    const tlsAlign = !mainJS && exports.__tls_align ? exports.__tls_align.value : 8;
    const pending = [];
    for (let i = 0; i < threads; i++) {
      // Allocated here, on the one thread that is currently running wasm: a
      // worker cannot allocate its own stack without first standing on one.
      const stack = mainJS ? 0 : exports.loft_thread_alloc(LOFT_WORKER_STACK, 16);
      const tls = tlsSize ? exports.loft_thread_alloc(tlsSize, tlsAlign) : 0;
      if (!mainJS && (!stack || (tlsSize && !tls))) {
        throw new Error('loft: out of memory for a worker stack');
      }
      const worker = new Worker(url, mainJS ? { type: 'module' } : undefined);
      pending.push(new Promise((resolve, reject) => {
        worker.onmessage = (e) => {
          if (e.data && e.data.loftWorker === 'ready') resolve();
          else if (e.data && e.data.loftWorker === 'failed') reject(new Error(e.data.error));
        };
        worker.onerror = (e) => reject(new Error(e.message || 'loft worker failed'));
      }));
      worker.postMessage({
        module, memory, handoff, mainJS,
        stackTop: stack + LOFT_WORKER_STACK, tlsBase: tls
      });
      loftWorkers.push(worker);
    }
    await Promise.all(pending);
    URL.revokeObjectURL(url);
    return exports.loft_pool_build() === 0 ? threads : 0;
  } catch (e) {
    console.warn('loft: threading unavailable, running par sequentially —', e.message || e);
    return 0;
  }
}

/**
 * A `TextDecoder` that also reads SHARED memory.
 *
 * `TextDecoder.decode` refuses a view onto a SharedArrayBuffer, and a threaded
 * build's whole linear memory is one — so every host call that reads a loft
 * string (print, output, deliver, …) would throw on a threaded page and nowhere
 * else.  Copying the bytes out first costs one small allocation per host call
 * and makes the two kinds of page behave identically.
 */
function loftTextDecoder() {
  const decoder = new TextDecoder();
  return {
    decode(view) {
      return decoder.decode(view.buffer instanceof ArrayBuffer ? view : view.slice());
    }
  };
}

/**
 * Instantiate a loft browser wasm — threaded when the build and the host both
 * allow it, plain when either doesn't.  This is the one place a loft page starts
 * from, so "how does this page get its memory and its threads" has a single
 * answer no matter which shell embeds it.
 *
 * Resolves to `{ instance, memory, threads }`; `memory` is null for a
 * single-threaded build (its memory is the instance's own export) and `threads`
 * is 0 when `par` will run sequentially.
 */
async function loftInstantiate(wasmBytes, imports, maxThreads) {
  const module = await WebAssembly.compile(wasmBytes);
  // A threaded build imports its memory, so the memory must exist — and be
  // shared — before the instance does.
  const memory = loftSharedMemory(wasmBytes);
  if (memory) imports.env = Object.assign(imports.env || {}, { memory });
  const result = await WebAssembly.instantiate(module, imports);
  const instance = result.instance || result;
  const threads = memory
    ? await startLoftWorkers(instance.exports, maxThreads || navigator.hardwareConcurrency,
                             { module, memory })
    : 0;
  // How many worker threads this page got — 0 means `par` runs sequentially.
  // A page that expected parallelism cannot otherwise tell: results are the same
  // either way, only slower.  `?loftTrace=1` goes further and has loft report
  // how many workers each individual `par` really dispatched across.
  globalThis.loftThreads = threads;
  if (instance.exports.loft_set_par_trace &&
      typeof location !== 'undefined' && /[?&]loftTrace=1/.test(location.search)) {
    instance.exports.loft_set_par_trace(1);
  }
  return { instance, memory, threads };
}

// One line, and the last one: `loft --html` inlines this file into a non-module
// <script> by deleting exactly this statement (as it does for the other glue).


// loft-gl-wasm.js — WebGL2 bridge for compiled loft WASM (--html export).
// Returns a WASM imports object with loft_gl.* and loft_io.* modules.
// Uses asyncify for frame yield: gl_swap_buffers suspends execution so
// the browser can render via requestAnimationFrame.

// Asyncify controller — manages suspend/resume across frames.
// Usage: const ac = new AsyncifyCtrl(instance);
//        ac.start('loft_start');  // runs until first swap_buffers
//        // on each rAF: ac.resume('loft_start');
// @P321c Phase 3b — decode base64-embedded PNG assets to raw RGB bytes.
// `rawAssets` is `{name: base64String, ...}` (Phase 3a embed in main.rs);
// resolves to `{name: {width, height, bytes: Uint8Array(rgb)}}` for the
// imaging bridge to look up sync.  Runs once after `WebAssembly.instantiate`
// + before `loft_start` so the wasm-side imaging_query/copy is synchronous.
async function decodeLoftAssets(rawAssets) {
  if (!rawAssets || typeof rawAssets !== 'object') return {};
  const out = {};
  for (const [name, b64] of Object.entries(rawAssets)) {
    if (typeof b64 !== 'string') { out[name] = b64; continue; }
    try {
      const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const blob = new Blob([bin], { type: 'image/png' });
      const bitmap = await createImageBitmap(blob);
      const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0);

const wasmBytes=Uint8Array.from(atob(wasmB64),c=>c.charCodeAt(0));
const canvas=document.getElementById('c');
const output=document.getElementById('out');
let mem;
// @P321(c) Phase 3a: raw base64 of *.png siblings of the entry .loft
// (auto-discovered).  Phase 3b decodes each to RGB bytes and replaces
// the slot with {width, height, bytes} before loft_start runs.
const ctrl={ac:null,assets:{}};
const imports=buildLoftImports(canvas,output,()=>mem,ctrl);
// @lib_plan-29 W2: apply each library's host.js-registered extension
// to the imports object (mutates `imports.loft_gl` in place).
for(const reg of (globalThis.LOFT_WASM_EXTENSIONS||[])){
  try{reg(imports,ctrl,()=>mem);}catch(e){console.error('loft host_js extension failed',e);}
}
// @PLN117 — one boot path: loftInstantiate threads the page when the wasm was
// built for it AND the host is cross-origin isolated, and otherwise brings it up
// exactly as before (par then runs sequentially, same results).
loftInstantiate(wasmBytes,imports).then(async ({instance,memory})=>{
  mem=memory||instance.exports.memory;
  // @P321(c) Phase 3b: decode base64 PNG assets to RGB bytes before
  // loft_start so the wasm-side imaging bridge looks them up sync.
  ctrl.assets=await decodeLoftAssets(ctrl.assets);
  if(instance.exports.asyncify_start_unwind){
    const ac=new AsyncifyCtrl(instance);
    ctrl.ac=ac;
    ac.start('loft_start');
    if(ac.sleeping){
      // Drive the asyncify resume loop.  A HIDDEN page (headless capture, a
      // backgrounded tab) throttles or fully pauses requestAnimationFrame, so
      // an rAF-only loop stalls at the first suspend (issue #450).  Pump via an
      // unthrottled MessageChannel while the page is hidden, and via rAF while
      // visible so a GL render loop stays vsync-aligned.  schedule() re-checks
      // visibility each tick, so a tab going hidden/visible adapts live.
      const mc=new MessageChannel();
      const pump=()=>{ if(ac.resume('loft_start'))schedule(); };
      mc.port1.onmessage=pump;
      const schedule=()=>{
        if(document.hidden)mc.port2.postMessage(0);
        else requestAnimationFrame(pump);
      };
      schedule();
    }
  }else{
    instance.exports.loft_start();
  }
});
