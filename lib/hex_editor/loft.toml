[package]
name    = "hex_editor"
version = "0.1.0"
loft    = ">=0.8"

[library]
entry = "src/hex_editor.loft"

# The `hex_*` family, from the REGISTRY. They are published at 0.1.0 and were
# byte-identical to ../../../loft-libs-world when this line was written (diffed, not
# assumed), so there is nothing to copy and no path into a tree another agent is editing.
#
# ⛔ **AND THAT DIFF IS STALE — MEASURED 2026-08-18: ALL FOURTEEN `hex_*` PACKAGES NOW
# DIFFER FROM THE CHECKOUT.** Eleven differ only in comments. **Three differ in CODE**,
# and one of those matters to a reader here:
#
#   hex_field   +73 lines, purely ADDITIVE (`stencil_unstamp*`) — we simply do not have them
#   hex_form    +13 lines of REFUSALS — the registry copy accepts malformed stencil
#               headers (`C1`/`C3`/`C4`) that the checkout rejects
#   hex_way      ✅ CLOSED 2026-08-20 by publishing 0.1.1 — see below
#
# ✅ **THE `hex_way` ROW IS GONE, AND CLOSING IT IS WHAT THIS NOTE IS FOR.** It carried
# two defects in the published 0.1.0: `track_offset` put an offset ARC on the far side of
# the way from its straights (an offset way came apart at its joints, measured at a **gap
# of 1.0** on a 0.5 offset — the sibling's own fix, unpublished), and `seg_distance`
# normalised an angle in **one direction only**, so an arc authored below the atan2 range
# reported points lying ON it as up to 1.53 away (found here, fixed upstream, `@HXY-007`).
# 0.1.1 carries both and this tree now requires it. ⚠ **Neither could ever reach moros** —
# every track built here is `track_straight`, and the straight branch never reads `dir` —
# so the floor is raised to say what we depend on, not to fix a symptom.
#
# ⚠ **Say `sh probe/way/drift.sh` rather than trusting this comment**: a byte-identity
# claim written once is a claim about the day it was written, which is how the sentence
# above this block came to be false for all fourteen packages.
#
# ⚠ A NOTE HERE SAID `hex_world` WAS "deliberately NOT here" WHILE IT WAS DECLARED
# TWENTY-FIVE LINES BELOW. It was true when this package was world-free and outlived
# that by every release since; plan 19 `L6.2` found it while renaming the store. The
# store IS a dependency — see the block above `hex_voxel` — and what the note was
# really guarding, a name shared with a different published lineage, is what the
# rename removed.
[dependencies]
hex_draw  = ">=0.1"
hex_form  = ">=0.1"
hex_field = ">=0.1"
# The centreline and its parallel — `track_offset` is the family's exact offset of
# a straight, which is what a wall's two faces are. The editor already depends on
# it for collision and for the fence; the geometry has no business deriving it a
# second time.
hex_way   = ">=0.1.1"   # 0.1.1 is the arc fixes — see hex_mesh's note and probe/way
# The wall run marks the edges its line crosses — `edges_halfplane_surf` and the
# surface it measures against are hex_edge's, and deriving them again here is what
# the whole package exists not to do.
hex_edge  = ">=0.1"
# S4 — the footprint. `Box` is the placement (twelve orientations, both orbits),
# `seat_write` sits it on the terrain, and `hex_grid` says which cell a world
# point is. All three were being re-derived in the editor.
# 0.1.1 is the AIM idiom — `snap_run_from_heading` + `wall_nearest_d24`, published
# 2026-08-24. `snap_run_d24`/`snap_run_p` take an ENDPOINT, which a mouse drag and a
# walked trace both have and a CONTROLLER does not: a controller has a facing and a
# push, with no point in it. ⚠ The floor is raised because `probe/m2p` calls it, not
# because a gesture does yet — the editor still traces. When one aims, AUTHORING_MAP
# `X108` is the rule it must obey: the two idioms are DIFFERENT MAPS (77.7% agreement,
# measured) and a gesture must use exactly one.
hex_shape = ">=0.1.1"
hex_place = ">=0.1"
# ⛔ THE REGION READER, AND IT IS `@HB-X45` RATHER THAN ANYTHING OF OURS.
# `rebuild_construct` takes a filled region, reads its convex hull, builds the form and
# VERIFIES it by re-drawing — gated upstream at 119/119 with `rho = 0`. Measured here in
# `probe/b5`: it describes 25 of 25 rooms exactly for ZERO `run_edges`, where the best rule
# this tree built over the MARKS is exact on 14 of 25 at 363..4834 calls each. ⚠ It was
# published and unused for months while a cut rule was designed, built and costed against
# the question it answers — see CLAUDE.md, *search before you design*.
hex_recover = ">=0.1"
hex_grid  = ">=0.1"
# ⚠ OURS, BY PATH. A gesture edits a world, so this package cannot stay world-free
# once it holds gestures. The path is because `hex_voxel` is UNPUBLISHED and lives in
# this tree — not, any longer, to dodge a name: plan 19 `L6.2` renamed the store from
# `hex_world`, so the registry's `hex_world` and ours no longer answer to one name and
# no resolver can pick the wrong one. `probe/l4/run.sh` control `D` is where that is
# measured. ⚠ It is still a path INSIDE this tree, unlike the paths into
# ../../../loft-libs-world that moros_map and moros_sim used to carry, which made a
# sibling checkout part of our build.
hex_voxel = { path = "../hex_voxel" }
# ⚠ OURS TOO, AND FOR THE SAME REASON THE STORE IS. A gesture that places a house
# from a FILE needs to know what a part is — plan 17 `A2.2`, where the procedural
# stencil gains an authored twin. The arrow is `hex_editor` → `hex_part` →
# `hex_voxel` and there is no cycle: `hex_part` knows what a part is and nothing
# about gestures, which is why the band FLOOR is passed in rather than derived
# there.
hex_part = { path = "../hex_part" }
