[package]
name    = "lavition_ui"
version = "0.1.0"
loft    = ">=0.8"
# ⚠ THE SOURCE STAYS WHERE IT IS BATTLE-TESTED, so the release is cut from moros and
# the registry entry is a FOREIGN-PACKAGE one. Moving the source into a loft-libs-*
# repo would hand a library to a repo whose CI cannot exercise it — the promotion
# rule running backwards.
repository = "jjstwerff/moros"
description = "Panel layout, hit-testing and text metrics for an in-engine editor UI: rectangles and hits, with no world, no lattice, no window and no GL."

# ⚠ BOTH FLOORS ARE THIS RELEASE, WHICH IS WHAT A FIRST RELEASE MEANS. They are
# promises to a consumer about which older releases this one is still a drop-in for
# (`api_`) and whose stored data it still reads (`data_`); on 0.1.0 there is nothing
# older, so both are trivially true and checkable.
#
# ⚠ RAISING A FLOOR IS HOW A BREAK IS DECLARED, and it is the only way — the release
# number is deliberately not an indicator. Keeping them still is the default. ⏭ The
# one already in sight: `EDITING_MODES` makes the verb table DATA, which reshapes
# `spec_verb` / `spec_verb_on` / `verbbar_build`. That is an `api_` move when it
# lands, and it should be a decision with a CHANGELOG line rather than a surprise.
api_compatible_with  = "0.1.0"
data_compatible_with = "0.1.0"

# ⏭ TIED TO THE `loft = ">="` BUMP ABOVE — NOT A STANDING TODO. Do this WHEN that number
# moves and not before; a note with no event attached is the kind nobody re-reads.
#
# ⏭ WHEN THE `loft` FLOOR NEXT MOVES: `text.char_slice(from, to)` slices by
# CHARACTERS and is the stdlib cure for the two-units defect `src/font.loft` closes by
# hand in `byte_after_chars` — seven call sites go through it. It needs a loft newer
# than this floor, and raising the floor to buy a tidier internal is a bad trade for a
# first release: it costs every consumer a toolchain upgrade to fix nothing they can
# observe. The hand-rolled walk ships with 0.1.0; `char_slice` is what replaces it the
# next time there is an independent reason to move `loft = ">="`.

[library]
entry = "src/lavition_ui.loft"

# ⚠ NO DEPENDENCIES, AND THAT IS THE CLAIM.
#
# This package was `moros_ui` and depended on `moros_sim` + `moros_editor` +
# `moros_map` — a player-physics and collision stack — because `panel_build` took
# a `ToolState`. The one program that needs a panel, `src/editor_client.loft`,
# uses none of those, so the panel was unusable by the only thing that wanted it.
#
# A rect is a rect and a text advance is a text advance. Nothing here needs a
# world, a lattice, a window or a GL context, and an empty dependency list is the
# cheapest possible proof of that — it cannot drift the way a comment can.
#
# See doc/claude/EDITOR_UI.md; the seam is `PanelSpec` (§U2).

# ⚠ ADMISSIBLE LOFT, AND DECLARED SO IT IS CHECKED RATHER THAN CLAIMED.
#
# @PLN86's admission proves a designated function safe AT LOAD — capability,
# termination, data integrity, backend — and which side of that boundary a library
# sits on is a property of its API, cheap to state while the signatures are being
# written and a re-architecture afterwards. This one is on the admissible side by
# construction: no `#native`, no I/O, no GL, and `src/` contains no `while` at all,
# so every loop is a `for` over a bound written down at the loop.
#
# ⚠ THE POINT IS THE NEGATIVE. Without this section `loft test` says "no # ⚠ THE KEY IS THE PROFILE NAME, not a keyword. `[sandbox] plug = [...]` in
# loft's own SANDBOX.md reads as a fixed word and is not one — it designates a
# profile CALLED `plug`, and with no `[profile.plug]` beside it the grant list is
# empty. That failure prints `allowed libraries: []`, which reads as *nothing is
# allowed here* rather than *you named a profile that does not exist*.
[sandbox]
ui = ["src/*.loft"]

# ⚠ `code` IS THE COMPILER'S OWN INTRINSICS, NOT A REACH OUTSIDE THE PACKAGE.
# Admission counts `OpPreAllocVector` — what building a `vector<T>` lowers to — as
# reaching a library named `code`, so a package that assembles a list at all is
# inadmissible until this is granted. Measured on `verbbar_text_list`, whose whole
# body is a loop appending rows.
[profile.ui]
allow_libs = ["code"]
