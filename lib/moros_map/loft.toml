[package]
name    = "moros_map"
version = "0.1.0"
loft    = ">=0.8"

[library]
entry = "src/moros_map.loft"

# ⚠ THE REGISTRY, NOT THE SIBLING CHECKOUT. A `path` dependency makes the whole
# directory it points at a search path, so this line reached far past `hex_field`:
# every package in `../../../loft-libs-world` became resolvable through it, from a
# tree another agent edits. CLAUDE.md's standing warning, and it was live here.
#
# The registry's 0.1.0 was byte-identical to the checkout when this was written (diffed,
# not assumed), so nothing changed but where it is read from. 758 tests green across all
# eight packages after the reroute. ⛔ **IT IS NO LONGER TRUE — measured 2026-08-18, all
# fourteen differ and three differ in CODE.** The long form is in `lib/hex_editor/loft.toml`
# beside the `hex_*` block; the instrument is `sh probe/way/drift.sh`.
#
# It was ALSO the first suspect when the editor's build died on `Expect token ;` at
# `hexwall.loft:113` — a valid line in a published library — and it was the wrong
# suspect: single-sourcing every dep did not fix that. The real cause is loft#714,
# a package reached through `--lib` being parsed without ITS dependencies, and the
# editor carries an explicit `use hex_shape;` for it. Recorded because a wrong
# hypothesis that leaves a right change behind is worth telling apart from a fix.
[dependencies]
hex_field = ">=0.1"
