[package]
name    = "hex_mesh"
version = "0.1.0"
loft    = ">=0.8"

[library]
entry = "src/hex_mesh.loft"

# ⚠ A LEAF, AND THAT IS THE WHOLE REASON IT IS ITS OWN PACKAGE. The mesher needs
# GEOMETRY (the PROJECTION: `hex_to_world`, `HEIGHT_SCALE`, the corner map) and it
# needs POLICY (`hex_editor`: `terrain_h`, `ground_open`, `SURFACE_MAT`) — two cones
# that nothing else wants together.
#
# Putting it in `moros_render` was tried and reverted: `moros_sim` depends on that,
# so it inherited `hex_editor`'s whole cone and its tests went red on `Cannot redefine
# 'fabs'` (from `hex_form`), then on `seg_len`. A package nobody else imports cannot
# do that to anybody — the server and the client import this, and `moros_sim` does
# not.
#
# ⚠ AND THE GEOMETRY HALF IS `hex_proj` NOW, NOT `moros_render` — plan 19 `L3′`,
# and that reverted experiment is exactly why. This package took the projection
# from `moros_render`, which made it the last Moros dependency of the whole
# lavition stack; moving the projection INTO here would have pointed the same arrow
# the other way and reddened `moros_sim` the same way. So it went to a package that
# depends on `hex_grid` and `graphics` and nothing else, which both sides can take.
[dependencies]
hex_proj     = { path = "../hex_proj" }
hex_voxel    = { path = "../hex_voxel" }
hex_editor   = { path = "../hex_editor" }
hex_grid     = ">=0.1"
graphics     = ">=0.1"
# ⚠ ARRIVED WITH THE PROPS MESHER — plan 22 `B1b.2c.3`. A wall run is a `hex_way`
# TRACK (the centreline the panels are built along) and an opening can be cut into a
# PART's own wall, so the mesher needs both. Neither widens the cone in a direction
# that matters: `hex_editor`, already here, depends on both.
hex_way      = ">=0.1"
hex_part     = { path = "../hex_part" }
