<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>moros editor — W0</title>
<style>
  html,body { margin:0; height:100%; background:#7b8ea3; overflow:hidden;
              font:13px/1.5 system-ui,sans-serif; color:#e8eef4 }
  canvas { display:block; width:100%; height:100% }
  #hud { position:fixed; left:10px; top:10px; padding:6px 10px; border-radius:4px;
         background:#0006; pointer-events:none; white-space:pre }
</style></head><body>
<canvas id="gl"></canvas>
<div id="hud">connecting…</div>
<script>
// The client DRAWS. It does not model.
//
// Everything on screen was derived on the server, in loft: the lattice, the hex
// geometry, the figure's proportions, the camera solve. This file receives
// triangles and two matrices and rasterises them. If a computation about the
// world ever appears below this line, the seam has been broken — that is the
// thing to catch in review, not a style note.
//
// Wire (text frames, `<tag>:<body>`):
//   →  ready:                 client is up, send the world
//   →  cam:<aspect>           give me a camera for this viewport
//   ←  M:r,g,b;f0,f1,…        one mesh: colour, then 6 floats/vertex (pos, normal)
//   ←  E:                     end of world
//   ←  C:<16 view>;<16 proj>  column-major matrices
const cv = document.getElementById('gl');
const hud = document.getElementById('hud');
const gl = cv.getContext('webgl2', { antialias: true });
if (!gl) { hud.textContent = 'no WebGL2'; throw new Error('no webgl2'); }

const VS = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
uniform mat4 uView, uProj;
out vec3 vNrm;
void main(){ vNrm = aNrm; gl_Position = uProj * uView * vec4(aPos,1.0); }`;

const FS = `#version 300 es
precision highp float;
in vec3 vNrm;
uniform vec3 uColor;
out vec4 frag;
void main(){
  // One directional light, flat-shaded — the reference look: matte, no specular.
  vec3 L = normalize(vec3(0.35,0.80,0.45));
  float d = max(dot(normalize(vNrm), L), 0.0);
  frag = vec4(uColor * (0.45 + 0.55*d), 1.0);
}`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const uView = gl.getUniformLocation(prog, 'uView');
const uProj = gl.getUniformLocation(prog, 'uProj');
const uColor = gl.getUniformLocation(prog, 'uColor');

const parts = [];          // {vao, count, color}
let view = null, proj = null;

function addMesh(body) {
  const semi = body.indexOf(';');
  const color = body.slice(0, semi).split(',').map(Number);
  const data = new Float32Array(body.slice(semi + 1).split(',').map(Number));
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
  gl.bindVertexArray(null);
  parts.push({ vao, count: data.length / 6, color });
}

function resize() {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, cv.width, cv.height);
}

function draw() {
  resize();
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.48, 0.55, 0.64, 1);           // the reference sky
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (view && proj) {
    gl.useProgram(prog);
    gl.uniformMatrix4fv(uView, false, view);
    gl.uniformMatrix4fv(uProj, false, proj);
    for (const p of parts) {
      gl.uniform3fv(uColor, p.color);
      gl.bindVertexArray(p.vao);
      gl.drawArrays(gl.TRIANGLES, 0, p.count);
    }
  }
  requestAnimationFrame(draw);
}

const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://')
                         + location.host + '/ws');
ws.onopen = () => { hud.textContent = 'connected'; ws.send('ready:'); };
ws.onclose = () => { hud.textContent = 'server closed'; };
ws.onerror = () => { hud.textContent = 'socket error'; };
ws.onmessage = (ev) => {
  const s = ev.data, c = s.indexOf(':');
  const tag = s.slice(0, c), body = s.slice(c + 1);
  if (tag === 'M') { addMesh(body); }
  else if (tag === 'E') {
    hud.textContent = `world: ${parts.length} meshes, `
      + `${parts.reduce((a, p) => a + p.count, 0)} verts`;
    ws.send('cam:' + (cv.clientWidth / cv.clientHeight));
  }
  else if (tag === 'C') {
    const [v, p] = body.split(';');
    view = new Float32Array(v.split(',').map(Number));
    proj = new Float32Array(p.split(',').map(Number));
  }
};

// Ask for a fresh camera when the viewport changes — the solve stays server-side.
addEventListener('resize', () => {
  if (ws.readyState === 1) ws.send('cam:' + (cv.clientWidth / cv.clientHeight));
});
requestAnimationFrame(draw);
</script></body></html>
